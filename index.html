<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Endless Driving - Phase 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #111827;
            color: white;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas {
            image-rendering: pixelated; 
        }
        /* Dashboard Dial Styles */
        .dial-bg {
            background: radial-gradient(circle, #1f2937 0%, #030712 100%);
            border: 4px solid #374151;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
        }
        .needle {
            transform-origin: bottom center;
            transition: transform 0.05s linear;
        }
        /* Mobile Pedal Styles */
        .pedal {
            background: linear-gradient(180deg, #4b5563 0%, #1f2937 100%);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 5px 10px rgba(0,0,0,0.5);
        }
        .pedal:active, .pedal.active-state {
            transform: scale(0.95) translateY(4px);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8), 0 2px 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-0 sm:p-4 bg-gray-900">

    <!-- Game Viewport Wrapper -->
    <div class="relative w-full max-w-5xl aspect-[21/9] sm:aspect-[16/7] bg-black sm:rounded-lg overflow-hidden border-0 sm:border-2 border-gray-700 shadow-2xl flex flex-col justify-between">
        
        <!-- Fuel Bar UI (NEW) -->
        <div class="absolute top-0 left-0 w-full h-3 bg-gray-800 z-20 border-b border-gray-700">
            <div id="fuelBar" class="h-full bg-green-500 transition-all duration-75 ease-linear" style="width: 100%;"></div>
        </div>

        <!-- The Game World -->
        <canvas id="gameCanvas" class="block w-full h-full absolute top-0 left-0 z-0"></canvas>

        <!-- Game Over Modal (NEW) -->
        <div id="gameOverModal" class="absolute inset-0 bg-black/80 z-30 hidden flex-col items-center justify-center backdrop-blur-sm">
            <h1 class="text-4xl sm:text-6xl text-red-500 font-black mb-2 tracking-widest drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">OUT OF GAS</h1>
            <p class="text-gray-300 mb-8 font-mono">Distance traveled: <span id="finalScore" class="text-white font-bold">0</span>m</p>
            <button id="btnRestart" class="px-8 py-3 bg-transparent border-2 border-red-500 text-red-400 hover:bg-red-500 hover:text-black font-bold uppercase rounded transition-all shadow-[0_0_15px_rgba(239,68,68,0.4)]">
                Restart Engine
            </button>
        </div>

        <!-- Phase 2 Dashboard UI Overlay -->
        <div id="dashboardOverlay" class="relative z-10 w-full h-32 sm:h-40 mt-auto bg-gradient-to-t from-black via-gray-900/90 to-transparent flex justify-between items-end px-4 sm:px-12 pb-2 sm:pb-6 pointer-events-none">
            
            <!-- Left: Brake Pedal -->
            <button id="btnBrake" class="pedal pointer-events-auto w-16 h-20 sm:w-20 sm:h-28 rounded-md flex items-center justify-center border border-gray-500 cursor-pointer touch-manipulation z-20">
                <div class="grid grid-cols-2 gap-1 opacity-50">
                    <div class="w-2 h-2 bg-gray-300 rounded-full"></div><div class="w-2 h-2 bg-gray-300 rounded-full"></div>
                    <div class="w-2 h-2 bg-gray-300 rounded-full"></div><div class="w-2 h-2 bg-gray-300 rounded-full"></div>
                </div>
            </button>

            <!-- Center: Telemetry Dials -->
            <div class="flex space-x-2 sm:space-x-8 items-end pb-2 pointer-events-auto">
                <!-- Tachometer (RPM) -->
                <div class="relative w-24 h-24 sm:w-32 sm:h-32 rounded-full dial-bg flex items-center justify-center">
                    <div class="absolute text-[10px] sm:text-xs text-gray-400 font-bold top-4
